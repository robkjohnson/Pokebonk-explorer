<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéBonk Builder</title>
<meta name="description" content="Unofficial build planner for PokéBonk: every League partner, move, passive, item, vitamin and fusion, with a build calculator.">
<style>
:root{
  --bg:#14121c; --panel:#1d1a28; --panel2:#262236; --line:#35304a; --text:#ece9f5; --muted:#9a94b3; --dim:#6e6888;
  --accent:#e94756; --accent2:#ffb23f; --good:#5ad87a; --bad:#ff6b6b; --link:#8fb8ff;
  --r:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(#1b1826,#17141f);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand .ball{width:18px;height:18px;border-radius:50%;background:linear-gradient(var(--accent) 0 46%,#111 46% 54%,#f4f4f4 54%);box-shadow:inset 0 0 0 2px #111}
.ver{color:var(--dim);font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:600}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--accent);color:#fff}
nav .count{font-size:11px;opacity:.7;margin-left:4px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:16px;padding:16px 18px;align-items:start}
.layout.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:1050px){.layout{grid-template-columns:1fr}.detail{position:static!important;max-height:none!important}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:14px}
.detail{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input[type=search],input[type=text],select,input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
input[type=number]{width:62px;padding:5px 6px}
input:focus,select:focus{border-color:var(--accent)}
input[type=search]{min-width:220px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-size:12px;color:var(--muted);user-select:none}
.chip.on{border-color:var(--accent);color:var(--text);background:#3a1f2a}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.type{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff;text-shadow:0 1px 1px #0006;white-space:nowrap}
.cls{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}
.rank{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.rank.common{color:#b9b4cc}.rank.uncommon{color:#5ad87a}.rank.rare{color:#5aa8ff}.rank.epic{color:#c070ff}.rank.legendary{color:#ffb23f}.rank.mythical{color:#ff77c8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;transition:border-color .12s,transform .12s;position:relative;overflow:hidden}
.card:hover{border-color:#5a5378;transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .dex{color:var(--dim);font-size:11px;font-family:var(--mono)}
.card .nm{font-weight:700;font-size:15px;margin:1px 0 5px}
.card .role{color:var(--muted);font-size:12px;margin-top:5px}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.card .star{position:absolute;right:9px;top:8px;font-size:11px;color:var(--accent2)}
table{border-collapse:collapse;width:100%}
th,td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;user-select:none;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
th .arr{color:var(--accent)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:#3a1f2a}
.tablewrap{overflow:auto;max-height:calc(100vh - 150px);border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
h2{margin:0 0 4px;font-size:22px}
h3{margin:18px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
h3:first-child{margin-top:0}
.sub{color:var(--muted)}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--accent);border:0;color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.x:hover{color:var(--bad)}
.statbar{display:grid;grid-template-columns:56px 38px 1fr;gap:8px;align-items:center;font-size:12px;margin:3px 0}
.statbar .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.statbar .bar i{display:block;height:100%;border-radius:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px}
.kv b{font-weight:600;color:var(--muted)}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0}
.box .t{font-weight:700}
.tag{font-size:11px;color:var(--muted);background:#2d2940;border-radius:4px;padding:1px 6px;margin-right:4px;white-space:nowrap}
.linkish{color:var(--link);cursor:pointer}
.linkish:hover{text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
.mono{font-family:var(--mono)}
.mini th,.mini td{padding:4px 6px;font-size:12px}
.empty{color:var(--dim);padding:30px;text-align:center}
.builder{display:grid;grid-template-columns:330px minmax(0,1fr) 400px;gap:14px;padding:16px 18px;align-items:start}
@media (max-width:1300px){.builder{grid-template-columns:1fr 1fr}.builder .col3{grid-column:1/-1}}
@media (max-width:800px){.builder{grid-template-columns:1fr}}
.slot{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0}
.slot .n{color:var(--dim);font-family:var(--mono);font-size:12px}
.slot select{width:100%}
.slot.locked{opacity:.45}
.warn{color:var(--accent2);font-size:12px}
.note{font-size:12px;color:var(--dim)}
.pill{display:inline-block;background:#2d2940;border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.big{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.statgrid div{display:flex;justify-content:space-between;border-bottom:1px dashed #2f2a42;padding:2px 0}
.statgrid span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.up{color:var(--good)}
.savedlist .box{cursor:pointer}
.savedlist .box:hover{border-color:#5a5378}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:9px 16px;border-radius:8px;font-weight:600;z-index:99;box-shadow:0 6px 20px #0008}
.help{cursor:help;border-bottom:1px dotted var(--dim)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="ball"></span>PokéBonk Builder</div>
  <nav id="tabs"></nav>
  <div class="ver" id="ver"></div>
</header>
<div id="app"></div>
<footer style="padding:18px;color:var(--dim);font-size:12px;text-align:center">Unofficial fan tool for <a href="https://pokebonk.com/">PokéBonk</a> by Charcher. Data extracted from the game client <span id="fver"></span>. Pokémon is © Nintendo / Game Freak / The Pokémon Company; this site is not affiliated with them.</footer>
<script>
const DATA = /*__POKEBONK_DATA__*/null;
(() => {
'use strict';
if (!DATA) { document.getElementById('app').innerHTML = '<div class="empty">No data embedded. Build this page with tools/build-ui.mjs.</div>'; return; }

// ---------- indexes ----------
const D = DATA;
const T_COLORS = {normal:'#9a9a78',fire:'#ee8130',water:'#6390f0',electric:'#d9b20e',grass:'#5fae3c',ice:'#5cc0bd',fighting:'#c22e28',poison:'#a33ea1',ground:'#c9a24a',flying:'#8f78e0',psychic:'#f95587',bug:'#94a516',rock:'#b6a136',ghost:'#735797',dragon:'#6f35fc',dark:'#705746',steel:'#8e8ea8',fairy:'#d685ad'};
const RARITY = ['Common','Uncommon','Rare','Epic','Legendary'];
const RARITY_CLS = ['common','uncommon','rare','epic','legendary'];
const speciesById = new Map(D.species.map(s => [s.id, s]));
const partnerById = new Map(D.partners.map(p => [p.id, p]));
const moveByKey = new Map(D.moves.map(m => [m.key, m]));
const itemByKey = new Map(D.items.map(i => [i.key, i]));
const vitByKey = new Map(D.vitamins.map(v => [v.key, v]));
const fusionByKey = new Map(D.fusions.map(f => [f.key, f]));
const labById = new Map(D.lab.map(l => [l.id, l]));
const typeName = t => (D.types.names && D.types.names[t]) || t;
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const SRC_ORDER = {kit:0, line:1, shared:2, any:3};
const SRC_LABEL = {kit:'Kit', line:'Evolution line', shared:'League (shared)', any:'Any (Mew)'};

// partner -> merged pool (union over evolution stages, lowest level, best source)
function mergedPool(p) {
  const m = new Map();
  for (const [sid, pl] of Object.entries(p.pools || {})) {
    for (const g of ['kit','line','shared']) for (const x of pl[g]) {
      const cur = m.get(x.move);
      const cand = {move:x.move, src:g, level:x.level, stage:+sid, from:x.from};
      if (!cur || SRC_ORDER[g] < SRC_ORDER[cur.src] || (g === cur.src && x.level < cur.level)) m.set(x.move, cand);
    }
    if (pl.any) for (const k of pl.any) if (!m.has(k)) m.set(k, {move:k, src:'any', level:1, stage:+sid});
  }
  return m;
}
const poolOf = new Map(D.partners.map(p => [p.id, mergedPool(p)]));
// species -> partner whose evolution line contains it
const partnerOfSpecies = new Map();
for (const p of D.partners) for (const sid of Object.keys(p.pools || {})) if (!partnerOfSpecies.has(+sid)) partnerOfSpecies.set(+sid, p.id);
// move usage
const moveUse = new Map(D.moves.map(m => [m.key, {partners:new Map(), learners:[], kitOf:[], fusions:[]}]));
for (const p of D.partners) for (const [k, x] of poolOf.get(p.id)) { const u = moveUse.get(k); if (u) u.partners.set(p.id, x); }
for (const p of D.partners) p.kit.forEach(k => moveUse.get(k)?.kitOf.push(p.id));
for (const s of D.species) { const seen = new Set(); for (const [k, lv] of s.learnset) if (!seen.has(k)) { seen.add(k); moveUse.get(k)?.learners.push([s.id, lv]); } }
for (const f of D.fusions) (f.moves || []).forEach(k => moveUse.get(k)?.fusions.push(f.key));
const partnersUsing = k => { const u = moveUse.get(k); return u ? [...u.partners.values()].filter(x => x.src !== 'any').length : 0; };
// passive owners
const passiveOwners = new Map();
for (const p of D.partners) { if (!passiveOwners.has(p.passive)) passiveOwners.set(p.passive, []); passiveOwners.get(p.passive).push(p.id); }

// ---------- formulas (mirrors the game's code; see formulas_source.json) ----------
const STAT_DEFAULTS = {attackSpeed:1,projectiles:0,area:1,duration:1,projSpeed:1,critChance:.05,critDamage:1.75,lifesteal:0,thorns:0,knockback:1,pickupRange:6,xpGain:1,gold:1,luck:0,luckMult:1,difficulty:1,eliteDamage:1,extraJumps:0,jumpHeight:1,statusChance:1,statusDamage:1,healing:1,superEffective:1,flinch:0,bounces:0,enemyAmount:1,megaCrit:0,overheal:0,powerup:1,eliteSpawn:1,slam:1};
function baseRunStats(sp, growth, meta = {}) {
  const r = sp.stats, tot = r.hp + r.atk + r.def + r.spa + r.spd + r.spe, a = x => x / tot * 6, g = 1 + growth * .12;
  const s = {maxHp:Math.round((70 + 45 * a(r.hp)) * g), regen:.25 + .25 * a(r.hp), armor:6 * a(r.def) + 3 * a(r.spd), evasion:.02 + .02 * a(r.spe), shieldMax:0, moveSpeed:.92 + .12 * a(r.spe), damage:g, physical:.82 + .2 * a(r.atk), special:.82 + .2 * a(r.spa), ...STAT_DEFAULTS, typeBoost:{}};
  for (const [k, v] of Object.entries(meta)) s[k] = (s[k] ?? 0) + v;
  return s;
}
function applyGroups(s, groups) { // adds first; inside each group bonuses >1 are summed, penalties multiply; groups multiply
  for (const g of groups) for (const m of g) if (m.add) s[m.stat] = (s[m.stat] ?? 0) + m.add;
  for (const g of groups) { const sum = {}; for (const m of g) if (m.mul) { if (m.mul < 1) s[m.stat] *= m.mul; else sum[m.stat] = (sum[m.stat] ?? 0) + m.mul - 1; } for (const [k, v] of Object.entries(sum)) s[k] *= 1 + v; }
  return s;
}
// expected value of a move at a level, given the upgrade-card rarity you assume
function moveAt(m, level, rarityIdx = 0) {
  const arch = D.archetypes[m.arch] || {stats:[]}, st = arch.stats || [], r = D.rarity[rarityIdx] ?? 1;
  const ups = Math.max(0, level - 1), k = r >= 1.6 ? 3 : 2, p = st.length ? Math.min(1, k / st.length) : 0;
  const has = x => st.includes(x);
  return {
    dmgMul: 1 + .08 * ups + (has('dmg') ? ups * p * .22 * r : 0),
    cdMul: has('cd') ? Math.pow(1 - p * Math.min(.25, .08 * r), ups) : 1,
    countAdd: has('count') ? ups * p * (r >= 1.6 ? 2 : 1) : 0,
    areaMul: 1 + (has('area') ? ups * p * .15 * r : 0),
    critAdd: has('crit') ? ups * p * .05 * r : 0,
    statusAdd: has('status') ? ups * p * .25 * r : 0,
    pierceAdd: (has('pierce') ? ups * p * Math.max(1, Math.round(r)) : 0),
  };
}
function moveDps(m, S, opts = {}) {
  const lv = moveAt(m, opts.level ?? 1, opts.rarity ?? 0);
  const stab = (opts.types || []).includes(m.type) ? (opts.adaptability ? 1.5625 : 1.25) : 1;
  const cls = m.cls === 'physical' ? S.physical : S.special;
  const hit = (m.dmg || 0) * lv.dmgMul * S.damage * cls * stab * (S.typeBoost?.[m.type] ?? 1);
  const crit = Math.min(1, S.critChance + (m.critBonus || 0) + lv.critAdd);
  const critMul = 1 + crit * (S.critDamage - 1);
  const archSt = (D.archetypes[m.arch]?.stats) || [];
  const count = (m.count || 1) + lv.countAdd + (archSt.includes('count') ? (S.projectiles || 0) : 0);
  const cd = (m.cd || 1) * lv.cdMul / (S.attackSpeed || 1);
  return {hit, crit, count, cd, area:(m.area || 0) * lv.areaMul * (S.area || 1), dps: hit * critMul * count / cd};
}
// Fused move (game: mods = ingredient mods combined; hit = 17·power·1.3·mods.dmg·(1+0.04·(stars−1)); cd ≥ 0.6)
function fusionDps(e, S, opts = {}) {
  const f = fusionByKey.get(e.fusion), ma = moveByKey.get(e.a.key), mb = moveByKey.get(e.b.key);
  if (!f || !ma || !mb) return {hit:0, crit:0, count:0, cd:1, dps:0};
  const r = opts.rarity ?? 0, la = moveAt(ma, e.a.level, r), lb = moveAt(mb, e.b.level, r);
  const stars = e.stars || 1, ls = moveAt({arch:'fusion'}, stars, r);
  const dmgMod = la.dmgMul + lb.dmgMul - 1 + (ls.dmgMul - 1);
  const cdMod = la.cdMul * lb.cdMul * ls.cdMul;
  const stab = (opts.types || []).includes(f.type) ? (opts.adaptability ? 1.5625 : 1.25) : 1;
  const cls = f.cls === 'physical' ? S.physical : S.special;
  const base = (D.archetypes.fusion?.dmg ?? 17) * f.power;
  const hit = base * 1.3 * dmgMod * (1 + (stars - 1) * .04) * S.damage * cls * stab * (S.typeBoost?.[f.type] ?? 1);
  const crit = Math.min(1, S.critChance + la.critAdd + lb.critAdd + ls.critAdd);
  const cd = Math.max(.6, f.cd * cdMod / (S.attackSpeed || 1));
  const count = f.hits || 1;
  return {hit, crit, count, cd, dps: hit * (1 + crit * (S.critDamage - 1)) * count / cd};
}
const isFusion = x => !!x?.fusion;
function migrateBuild(b) { // older saves kept fusions in a separate list
  if (Array.isArray(b.fusions) && b.fusions.length) for (const f of b.fusions) {
    const ia = b.moves.findIndex(x => x.key === f.a), ib = b.moves.findIndex(x => x.key === f.b);
    if (ia < 0 || ib < 0) continue;
    const entry = {fusion:f.fusion, a:b.moves[ia], b:b.moves[ib], stars:1};
    b.moves[Math.min(ia, ib)] = entry; b.moves.splice(Math.max(ia, ib), 1);
  }
  delete b.fusions; return b;
}
const plainDps = m => moveDps(m, {damage:1, physical:1, special:1, critChance:.05, critDamage:1.75, attackSpeed:1, area:1, projectiles:0, typeBoost:{}}).dps;
// Bill's Machine: which fusion two moves make (signature → reaction → same type → glitch)
function fusionFor(a, b) {
  const sig = D.fusions.find(f => f.kind === 'signature' && f.moves && ((f.moves[0] === a.key && f.moves[1] === b.key) || (f.moves[0] === b.key && f.moves[1] === a.key)));
  if (sig) return sig;
  const pr = (f, x, y) => f.pair[0].includes(x) && f.pair[1].includes(y);
  const re = D.fusions.find(f => f.kind === 'reaction' && (pr(f, a.type, b.type) || pr(f, b.type, a.type)));
  if (re) return re;
  if (a.type === b.type) { const t = D.fusions.find(f => f.kind === 'type' && f.type === a.type); if (t) return t; }
  return D.fusions.find(f => f.kind === 'glitch');
}
const fusable = m => m && m.arch !== 'weather' && m.arch !== 'buff' && m.arch !== 'fusion';

// ---------- tiny DOM helper ----------
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const typeBadge = t => t ? h('span', {class:'type', style:{background:T_COLORS[t] || '#666'}}, typeName(t)) : '';
const clsBadge = c => c ? h('span', {class:'cls'}, c === 'physical' ? 'Phys' : c === 'special' ? 'Spec' : cap(c)) : '';
const fmt = (n, d = 1) => n == null || isNaN(n) ? '–' : (Math.abs(n) >= 100 ? Math.round(n).toLocaleString() : (+n).toFixed(d).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1'));
const pct = (n, d = 0) => n == null ? '–' : (n * 100).toFixed(d) + '%';
const statLabel = k => (D.statLabels[k]?.[0]) || k;
function modText(m) {
  const kind = D.statLabels[m.stat]?.[1];
  if (m.add != null) return `${statLabel(m.stat)} ${m.add >= 0 ? '+' : ''}${kind === 'pctpts' ? pct(m.add, 1) : fmt(m.add, 2)}`;
  if (m.mul != null) return `${statLabel(m.stat)} ×${fmt(m.mul, 3)}`;
  return statLabel(m.stat);
}
function toast(msg) { const t = h('div', {class:'toast'}, msg); document.body.append(t); setTimeout(() => t.remove(), 1800); }
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// sortable table
function table(rows, cols, opts) {
